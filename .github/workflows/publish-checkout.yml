name: Publish checkout to cl-systems

on:
  workflow_dispatch:
    inputs:
      version:
        description: "OCI tag (default: .asd :version)"
        required: false
        default: ""
      packager_version:
        description: "cl-repository-packager OCI tag (default: latest anchor)"
        required: false
        default: "latest"

env:
  SBCL_VERSION: 2.6.7
  ROSWELL_VERSION: "26.02.116"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        system: [mcp-backend-streamable-http]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: egao1980/cl-repository/.github/actions/setup-client@main

      - uses: egao1980/cl-repository/.github/actions/setup-roswell@main
        with:
          sbcl-version: ${{ env.SBCL_VERSION }}
          roswell-version: ${{ env.ROSWELL_VERSION }}

      - name: Publish ${{ matrix.system }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          PKG_SYSTEM: ${{ matrix.system }}
          PKG_VERSION: ${{ inputs.version }}
          PACKAGER_VERSION: ${{ inputs.packager_version }}
        run: ros -l scripts/publish-checkout.lisp -q
